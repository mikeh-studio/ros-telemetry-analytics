services:
  gateway:
    build:
      context: .
      dockerfile: demo/gateway/Dockerfile
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      PYTHONUNBUFFERED: "1"
    volumes:
      - gateway-state:/state
    restart: "no"

volumes:
  gateway-state:
