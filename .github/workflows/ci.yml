name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,demo]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=ros_telemetry_analytics --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: ros-telemetry --help

  flink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: streaming/flink-job

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/web/package-lock.json
      - run: npm ci
        working-directory: demo/web
      - run: npm test -- --run
        working-directory: demo/web
      - run: npm run build
        working-directory: demo/web

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build every demo image
        run: |
          started_at=$(date +%s)
          docker compose build
          elapsed=$(( $(date +%s) - started_at ))
          echo "### Compose performance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cold image build: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Start complete stack and measure readiness
        run: |
          started_at=$(date +%s)
          docker compose up -d
          python scripts/smoke_demo.py --wait-only --timeout 90
          elapsed=$(( $(date +%s) - started_at ))
          echo "- Warm stack readiness: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise clean recorded mission
        run: >-
          python scripts/smoke_demo.py --timeout 240 --run-id ci-clean-smoke
          --result-file /tmp/clean-smoke.json
      - name: Compare Flink summaries with the batch oracle
        run: >-
          docker compose exec -T api
          python scripts/compare_demo_oracle.py ci-clean-smoke --root /app --timeout 60
      - name: Restart the replayer with its persisted epoch volume
        run: docker compose restart replayer
      - name: Exercise camera dropout on a second run
        run: >-
          python scripts/smoke_demo.py --timeout 180 --run-id ci-camera-dropout
          --rate 1 --scenario camera-dropout --after-result /tmp/clean-smoke.json
      - name: Install browser smoke dependencies
        working-directory: demo/web
        run: npm ci && npx playwright install --with-deps --only-shell chromium
      - name: Verify the completed mission in a real browser
        working-directory: demo/web
        env:
          EXPECT_DROPOUT: "1"
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flight-deck-playwright-report
          path: |
            demo/web/playwright-report/
            demo/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture service state and logs
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=300
      - name: Tear down cleanly
        if: always()
        run: docker compose down -v --remove-orphans
