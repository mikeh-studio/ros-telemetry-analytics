pipeline:
  project_root: ..
  input_roots:
    - data/raw
  output_root: data/bronze
  excluded_directory_names:
    - downloads
    - public_datasets
  parquet_batch_size: 50000

analytics:
  domain_analyzers:
    enabled: true
    command_topic_patterns:
      - cmd_vel
      - command
    stationary_speed_threshold_mps: 0.05
    odometry_pose_jump_warn_m: 1.0
    imu_acceleration_warn_mps2: 30.0
    imu_angular_velocity_warn_rad_s: 10.0
    command_motion_threshold_mps: 0.1
    command_tracking_error_warn_mps: 0.5
    command_response_window_ms: 500.0
    tf_translation_jump_warn_m: 1.0
    image_dark_warn_mean: 20.0
    image_bright_warn_mean: 235.0
    image_sharpness_warn: 2.0
    event_merge_gap_ms: 500.0
  expected_rates:
    - pattern: /(?:image_raw|camera_info)$
      expected_rate_hz: 30.0
  gap_threshold_multiplier: 1.5
  minimum_rate_ratio: 0.8
  maximum_rate_ratio: 1.2
  continuity_topic_patterns:
    - ^/tf$
    - ^/tf_static$
    - pose
    - odom
    - visual_slam
  continuity_gap_ratio_warn: 3.0
  stereo_pairing_window_ms: 20.0
  stereo_skew_warn_ms: 5.0
