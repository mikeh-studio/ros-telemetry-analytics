[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-robot-telemetry-analytics"
version = "0.1.0"
description = "Automatic ROS bag ingestion and production-oriented telemetry health analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Robot Telemetry Analytics contributors" }]
keywords = ["ROS", "robotics", "telemetry", "MCAP", "VSLAM", "NVIDIA Isaac"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
urls = { Repository = "https://github.com/mikeh-studio/isaac-robot-telemetry-analytics", Issues = "https://github.com/mikeh-studio/isaac-robot-telemetry-analytics/issues" }
dependencies = [
  "mcap>=1.3,<2",
  "polars>=1.30,<2",
  "pyarrow>=18,<25",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "rosbags>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
  "wheel>=0.45,<1",
]

[project.scripts]
isaac-telemetry = "isaac_telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["isaac_telemetry*"]

[tool.setuptools.package-data]
isaac_telemetry = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["isaac_telemetry"]
omit = ["src/isaac_telemetry/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
