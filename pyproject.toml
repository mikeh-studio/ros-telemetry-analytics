[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ros-telemetry-analytics"
version = "0.1.0"
description = "Automatic ROS bag ingestion and payload-aware robot telemetry analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ROS Telemetry Analytics contributors" }]
keywords = ["ROS", "robotics", "telemetry", "MCAP", "VSLAM", "NVIDIA Isaac"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
urls = { Repository = "https://github.com/mikeh-studio/ros-telemetry-analytics", Issues = "https://github.com/mikeh-studio/ros-telemetry-analytics/issues" }
dependencies = [
  "mcap>=1.3,<2",
  "numpy>=1.26,<3",
  "polars>=1.30,<2",
  "pyarrow>=18,<25",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "rosbags>=0.11,<0.12",
]

[project.optional-dependencies]
demo = [
  "aiokafka==0.14.0",
  "fastapi==0.141.1",
  "jsonschema==4.26.0",
  "uvicorn[standard]==0.52.1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
  "wheel>=0.45,<1",
]

[project.scripts]
ros-telemetry = "ros_telemetry_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ros_telemetry_analytics*"]

[tool.setuptools.package-data]
ros_telemetry_analytics = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "demo_integration: integration tests for generated demo assets and services",
]

[tool.coverage.run]
branch = true
source = ["ros_telemetry_analytics"]
omit = ["src/ros_telemetry_analytics/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
